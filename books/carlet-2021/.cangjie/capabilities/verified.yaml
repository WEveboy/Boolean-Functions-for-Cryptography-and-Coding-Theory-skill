schema_version: 1
bundle_id: bundle.carlet-boolean-research
book:
  title: Boolean Functions for Cryptography and Coding Theory
  author: Claude Carlet
  source_pack: carlet-2021
  baseline_tag: v0.2.0
entry:
  name: carlet-boolean-research
  description: 基于Carlet专著的布尔函数研究：ANF、Walsh、bent/APN、BCT、迹与对偶基、EA/CCZ给定证书、高阶RM距离和函数码重量分布。提供预算内精确核验与批量实验；不作未知等价搜索、完整分类或系统安全证明。
  core_principles:
  - 先固定n、m、真值表位序和域模型；按意图读一张能力卡。
  - 区分B原书、D独立实现、H猜想；有限全算不冒充无限族证明。
  - 向量性质检查所有非零分量；置换、APN、AB和平衡各自核验。
  - 命令和预算见resources/usage.md；结果写用户工作目录。
  - 第13章仅表示出版时状态；当前开放性和新颖性另查一手文献。
  out_of_scope:
  - 一般译码、未知EA/CCZ变换搜索与完整分类、系统安全证明；DLCT/FAI算法。
  stop_conditions:
  - 缺规格时先补齐；超预算或定理前提不满足时报告未算/未证。
router_entry:
  name: carlet-boolean-research-router
  description: 基于Carlet专著的布尔函数研究：ANF、Walsh、bent/APN、BCT、迹与对偶基、EA/CCZ给定证书、高阶RM距离和函数码重量分布。提供预算内精确核验与批量实验；不作未知等价搜索、完整分类或系统安全证明。
